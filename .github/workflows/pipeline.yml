name: Pipeline GPM - Planilha Principal
on:
  #schedule:
    # Horários em UTC (Brasília = UTC-3)
    # Minutos ímpares e fora de pico para reduzir atraso do agendador.
    #- cron: '23 7 * * *'   # 04:23 BRT
    #- cron: '17 9 * * *'   # 06:17 BRT
    #- cron: '37 11 * * *'  # 08:37 BRT
    #- cron: '23 15 * * *'  # 12:23 BRT
    #- cron: '13 23 * * *'  # 20:13 BRT
    #- cron: '43 2 * * *'   # 23:43 BRT (do dia anterior em UTC)
  workflow_dispatch:        # Permite rodar manualmente pelo painel do GitHub
    inputs:
      wait_seconds:
        description: "Espera (s) entre as etapas. So aquecimento: o bloco3 valida a propagacao do IMPORTRANGE por conta propria."
        required: false
        default: "30"
jobs:
  rodar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: '1'
      GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
      STEP_WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '30' }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: 1) Compilador consulta serviços GPM
        run: python compilador_consulta_servicos_GPM.py
      - name: Aguardar entre etapas (propagacao Drive/Sheets)
        run: sleep "$STEP_WAIT_SECONDS"
      - name: 2) Bloco 3 - Planilha principal
        run: python bloco3_plan_principal.py
      - name: Aguardar entre etapas (propagacao Drive/Sheets)
        run: sleep "$STEP_WAIT_SECONDS"
      - name: 3) Compilador planilha principal
        run: python compilador_planilha_principal.py
