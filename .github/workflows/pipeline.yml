name: Pipeline GPM - Planilha Principal
on:
  #schedule:
    # Horários em UTC (Brasília = UTC-3)
    # Minutos ímpares e fora de pico para reduzir atraso do agendador.
    #- cron: '23 7 * * *'   # 04:23 BRT
    #- cron: '17 9 * * *'   # 06:17 BRT
    #- cron: '37 11 * * *'  # 08:37 BRT
    #- cron: '23 15 * * *'  # 12:23 BRT
    #- cron: '13 23 * * *'  # 20:13 BRT
    #- cron: '43 2 * * *'   # 23:43 BRT (do dia anterior em UTC)
  workflow_dispatch:        # Permite rodar manualmente pelo painel do GitHub
jobs:
  rodar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: '1'
      GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: 1) Compilador consulta serviços GPM
        run: python compilador_consulta_servicos_GPM.py
      - name: Aguardar 2 minutos
        run: sleep 120
      - name: 2) Bloco 3 - Planilha principal
        run: python bloco3_plan_principal.py
      - name: Aguardar 2 minutos
        run: sleep 120
      - name: 3) Compilador planilha principal
        run: python compilador_planilha_principal.py
